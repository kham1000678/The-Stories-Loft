<!DOCTYPE html>
<html>
<head>
<title>Admin - The Stories Loft</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:system-ui;background:#0f172a;color:white;padding:20px}
.box{background:#1e293b;padding:20px;border-radius:16px;display:inline-block;margin:8px;min-width:130px;text-align:center;border:1px solid #334155}
.box h2{font-size:36px;margin:0;color:#38bdf8}
.chart-box{background:#1e293b;padding:20px;border-radius:16px;margin-top:20px;border:1px solid #334155}
table{width:100%;margin-top:20px;border-collapse:collapse;background:#1e293b;border-radius:12px;overflow:hidden}
th,td{padding:14px;text-align:left;border-bottom:1px solid #334155}
</style>
</head>
<body>
<h1>📊 The Stories Loft - Dashboard</h1>
<div id="stats">Loading...</div>

<div class="chart-box">
<h3>📈 Views Analytics</h3>
<canvas id="myChart" height="120"></canvas>
</div>

<table><tr><th>Story ID</th><th>Views</th><th>Hearts</th><th>Popularity</th></tr><tbody id="rows"></tbody></table>

<script>
let chart;
async function load(){
  const r = await fetch('http://localhost:3000/api/dashboard');
  const d = await r.json();
  
  document.getElementById('stats').innerHTML = `
    <div class="box"><h2>${d.visitors_today}</h2><p>Visitors Today</p></div>
    <div class="box"><h2>${d.total_views}</h2><p>Total Views</p></div>
    <div class="box"><h2>${d.total_likes}</h2><p>Total Likes</p></div>
    <div class="box"><h2>${d.stories.length}</h2><p>Stories</p></div>
  `;
  
  document.getElementById('rows').innerHTML = d.stories.map(s=>{
    const bar = '█'.repeat(Math.min(s.views, 10));
    return `<tr><td>${s.id}</td><td>${s.views}</td><td>${s.hearts}</td><td style="color:#38bdf8">${bar} ${s.views>5?'🔥':''}</td></tr>`;
  }).join('');

  // CHART
  const ctx = document.getElementById('myChart').getContext('2d');
  if(chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: d.stories.map(s=>'Story '+s.id),
      datasets: [
        {label:'Views', data:d.stories.map(s=>s.views), backgroundColor:'#38bdf8'},
        {label:'Hearts', data:d.stories.map(s=>s.hearts), backgroundColor:'#fb7185'}
      ]
    },
    options:{responsive:true, plugins:{legend:{labels:{color:'white'}}}, scales:{x:{ticks:{color:'white'}}, y:{ticks:{color:'white'}}}}
  });
}
load();
setInterval(load, 3000);
</script>
</body>
</html>
