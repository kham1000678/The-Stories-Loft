<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Stories Loft</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f5f0;font-family:'Inter',sans-serif}
header{background:#1a2733;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{color:white;font-family:'Playfair Display',serif;font-size:32px;font-weight:700;line-height:0.9}
.logo small{font-size:12px;display:block;letter-spacing:2px;font-family:'Inter';margin-top:-2px}
.menu{color:white;font-size:28px}
.hero{background:#1a2733;color:white;padding:40px 20px 80px}
.hero h1{font-family:'Playfair Display',serif;font-size:42px;line-height:1.1;max-width:400px}
.hero h1 i{font-style:italic;font-weight:400}
.hero p{margin-top:15px;color:#a0aec0;max-width:300px;font-size:14px}
.hero button{margin-top:18px;background:transparent;border:1px solid #d4a574;color:#d4a574;padding:8px 20px;border-radius:20px}
.container{padding:0 16px;margin-top:-40px}
.card{background:white;border-radius:2px;box-shadow:0 4px 20px rgba(0,0,0,.1);margin-bottom:20px;overflow:hidden}
.card img{width:100%;height:220px;object-fit:cover;display:block}
.card-body{padding:16px}
.card-body h3{font-family:'Inter',sans-serif;font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:0.5px}
.card-body p{color:#6b7280;font-size:13px;margin-top:8px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.card-footer span{font-size:12px;color:#9ca3af}
.btn{border:1px solid #1a2733;padding:6px 14px;border-radius:20px;font-size:12px;background:white;cursor:pointer;font-weight:600}
#reader{display:none;background:white;min-height:100vh;padding:20px}
#reader img{width:100%;max-height:300px;object-fit:cover}
#reader h1{font-family:'Playfair Display',serif;margin:15px 0;font-size:28px}
#reader .content{white-space:pre-wrap;line-height:1.7;color:#374151}
</style>
</head>
<body>
<header>
<div class="logo">The Story<br>Loft<small>THE STORIES LOFT</small></div>
<div class="menu">☰</div>
</header>

<div id="listView">
<div class="hero">
<h1>In The Beginning, There Was A Story.<br><i>And The Story Continues.</i></h1>
<p>Wherever there's a tale, there's a change. We believe.</p>
<button>Read More...</button>
</div>
<div class="container" id="stories">Loading...</div>
</div>

<div id="reader">
<button onclick="showList()" style="margin-bottom:15px;border:1px solid #1a2733;padding:6px 14px;border-radius:20px;background:white">← Back</button>
<img id="rImg" src="">
<h1 id="rTitle"></h1>
<div style="color:#9ca3af;font-size:13px"><span id="rViews"></span> • <span id="rHearts"></span></div>
<div style="margin:15px 0"><button onclick="heart()" id="heartBtn" class="btn">❤️ Heart</button></div>
<div class="content" id="rContent"></div>
</div>

<script>
const IMAGES=["https://images.unsplash.com/photo-1512820790803-83ca734da794?w=800","https://images.unsplash.com/photo-1495446815901-a7297e633e8d?w=800","https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=800","https://images.unsplash.com/photo-1519682337058-a94d519337bc?w=800"];
let currentId=null;
async function load(){
 let res=await fetch('/api/stories');let data=await res.json();
 document.getElementById('stories').innerHTML=data.map((s,i)=>`
  <div class="card" onclick="openStory(${s.id},${i})">
   <img src="${IMAGES[i%IMAGES.length]}">
   <div class="card-body">
    <h3>${s.title}</h3>
    <p>${s.content.substring(0,200)}...</p>
    <div class="card-footer">
     <span>👁️ ${s.views||0} &nbsp; ❤️ ${s.hearts||0}</span>
     <button class="btn">READ MORE</button>
    </div>
   </div>
  </div>
 `).join('')||'<p style="text-align:center;padding:40px">No stories yet</p>';
}
async function openStory(id,imgIdx){
 currentId=id;
 document.getElementById('listView').style.display='none';
 document.getElementById('reader').style.display='block';
 let s=await (await fetch('/api/stories/'+id)).json();
 document.getElementById('rTitle').innerText=s.title;
 document.getElementById('rContent').innerText=s.content;
 document.getElementById('rImg').src=IMAGES[imgIdx%IMAGES.length];
 document.getElementById('rViews').innerText='👁️ '+(s.views||0)+' views';
 document.getElementById('rHearts').innerText='❤️ '+(s.hearts||0)+' hearts';
 fetch('/api/stories/'+id+'/view',{method:'POST'});
 window.scrollTo(0,0);
}
function showList(){document.getElementById('reader').style.display='none';document.getElementById('listView').style.display='block';load();}
async function heart(){let r=await fetch('/api/stories/'+currentId+'/heart',{method:'POST'});let d=await r.json();document.getElementById('rHearts').innerText='❤️ '+(d.hearts||0)+' hearts';document.getElementById('heartBtn').innerText='💖 Thanked!';}
load();
</script>
</body>
</html>
