<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Stories Loft - Where stories live</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f172a;--card:#1e293b;--accent:#38bdf8;--text:#e2e8f0;--muted:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.6}
header{padding:40px 20px;text-align:center;border-bottom:1px solid #1e293b}
header h1{font-family:'Merriweather',serif;font-size:2.8rem;letter-spacing:-1px}
header h1 span{color:var(--accent)}
header p{color:var(--muted);margin-top:8px;font-size:1.1rem}
.container{max-width:1100px;margin:0 auto;padding:30px 20px}
#stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:var(--card);border-radius:16px;padding:20px;cursor:pointer;transition:.2s;border:1px solid #334155}
.card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 10px 30px rgba(56,189,248,.15)}
.card h3{font-family:'Merriweather',serif;font-size:1.3rem;margin-bottom:10px}
.card p{color:var(--muted);font-size:.95rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:12px;margin-top:14px;font-size:.85rem;color:var(--muted)}
.meta span{background:#0f172a;padding:4px 10px;border-radius:20px}
#reader{display:none;max-width:700px;margin:0 auto}
#reader button{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:8px 16px;border-radius:8px;cursor:pointer;margin-bottom:20px}
#reader h1{font-family:'Merriweather',serif;font-size:2.2rem;margin-bottom:10px}
#reader .content{white-space:pre-wrap;font-size:1.15rem;line-height:1.8;margin-top:20px}
.actions{display:flex;gap:10px;margin:20px 0}
.actions button{background:var(--card);border:1px solid #334155;color:var(--text);padding:10px 18px;border-radius:30px;cursor:pointer;font-weight:600}
.actions button:hover{border-color:var(--accent)}
.loading{text-align:center;color:var(--muted);padding:60px}
</style>
</head>
<body>
<header>
<h1>The <span>Stories</span> Loft</h1>
<p>Cozy corners. Timeless tales. Written from the heart.</p>
</header>

<div class="container">
<div id="stories" class="loading">Loading stories...</div>

<div id="reader">
<button onclick="showList()">← Back to Loft</button>
<h1 id="rTitle"></h1>
<div class="meta"><span id="rViews"></span><span id="rHearts"></span></div>
<div class="actions">
<button id="heartBtn" onclick="heart()">❤️ Heart this story</button>
</div>
<div class="content" id="rContent"></div>
</div>
</div>

<script>
let currentId=null;
async function loadStories(){
 try{
  let res=await fetch('/api/stories');
  let data=await res.json();
  if(!data.length){document.getElementById('stories').innerHTML='<div class="loading">No stories yet. Check back soon ✨</div>';return;}
  document.getElementById('stories').innerHTML=data.map(s=>`
   <div class="card" onclick="openStory(${s.id})">
    <h3>${s.title}</h3>
    <p>${(s.content||'').substring(0,150)}...</p>
    <div class="meta"><span>👁️ ${s.views||0}</span><span>❤️ ${s.hearts||0}</span><span>#${s.id}</span></div>
   </div>
  `).join('');
  document.getElementById('stories').classList.remove('loading');
 }catch(e){document.getElementById('stories').innerHTML='Failed to load stories. Refresh page.'}
}

async function openStory(id){
 currentId=id;
 document.getElementById('stories').style.display='none';
 document.getElementById('reader').style.display='block';
 let res=await fetch('/api/stories/'+id);
 let s=await res.json();
 document.getElementById('rTitle').innerText=s.title;
 document.getElementById('rContent').innerText=s.content;
 document.getElementById('rViews').innerText='👁️ '+(s.views||0)+' views';
 document.getElementById('rHearts').innerText='❤️ '+(s.hearts||0)+' hearts';
 window.scrollTo(0,0);
 // increase view
 fetch('/api/stories/'+id+'/view',{method:'POST'});
}

function showList(){
 document.getElementById('reader').style.display='none';
 document.getElementById('stories').style.display='grid';
 loadStories();
}

async function heart(){
 if(!currentId) return;
 let res=await fetch('/api/stories/'+currentId+'/heart',{method:'POST'});
 let d=await res.json();
 document.getElementById('rHearts').innerText='❤️ '+(d.hearts||0)+' hearts';
 document.getElementById('heartBtn').innerText='💖 Thank you!';
}
loadStories();
</script>
</body>
</html>
