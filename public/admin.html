<!DOCTYPE html>
<html><head><title>Admin - The Stories Loft</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:system-ui;background:#0f172a;color:white;padding:20px}input,textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:0}textarea{height:250px}button{background:#38bdf8;color:black;padding:12px 20px;border:0;border-radius:8px;font-weight:bold;cursor:pointer;width:100%}#msg{margin:10px 0}</style>
</head><body>
<h1>📚 The Stories Loft - Dashboard</h1>
<div id="msg"></div>
<input id="title" placeholder="Story Title">
<textarea id="content" placeholder="Write your story here..."></textarea>
<button onclick="post()">Post Story</button>
<hr>
<h3>Views Analytics</h3>
<div id="list">Loading stories...</div>
<script>
const PASS = "Msdian07*";
async function load(){
 try{
  let r = await fetch('/api/stories');
  let data = await r.json();
  document.getElementById('list').innerHTML = data.map(s=>`<div style="padding:8px;border-bottom:1px solid #334155"><b>${s.id}</b> - ${s.title} - 👁️${s.views||0} ❤️${s.hearts||0} <button onclick="del(${s.id})" style="width:auto;background:red;color:white;padding:4px 8px">Delete</button></div>`).join('') || 'No stories yet';
 }catch(e){ document.getElementById('list').innerHTML='Failed to load - but you can still post!'; }
}
async function post(){
 let title=document.getElementById('title').value;
 let content=document.getElementById('content').value;
 if(!title||!content) return alert('Fill both');
 document.getElementById('msg').innerText='Posting...';
 let r = await fetch('/api/stories',{
  method:'POST',
  headers:{'Content-Type':'application/json','x-admin-password':PASS},
  body:JSON.stringify({title,content})
 });
 let d = await r.json();
 if(r.ok){ document.getElementById('msg').innerText='✅ Posted! ID: '+d.id; document.getElementById('title').value=''; document.getElementById('content').value=''; load(); }
 else document.getElementById('msg').innerText='❌ Error: '+(d.error||r.status);
}
async function del(id){
 if(!confirm('Delete '+id+'?')) return;
 await fetch('/api/stories/'+id,{method:'DELETE',headers:{'x-admin-password':PASS}});
 load();
}
load();
</script>
</body></html>
