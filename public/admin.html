<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Admin - The Stories Loft</title>
<style>body{font-family:Arial;background:#0f172a;color:white;padding:20px}input,textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none}textarea{height:300px}button{background:#38bdf8;color:#000;padding:12px 20px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;width:100%}.story{background:#1e293b;padding:10px;margin:10px 0;border-radius:8px;display:flex;justify-content:space-between}</style>
</head><body>
<h1>📚 The Stories Loft - Dashboard</h1>
<input id="key" placeholder="Admin Key - type khamkor123 here" value="khamkor123">
<input id="title" placeholder="Story Title">
<input id="image" placeholder="Image URL - https://...">
<textarea id="content" placeholder="Write your FULL story here... (5000 words allowed)"></textarea>
<button onclick="post()">Post Story</button>
<p id="msg"></p>
<hr><h3>Views Analytics</h3><div id="list">No stories yet</div>
<script>
async function load(){let r=await fetch('/api/stories');let s=await r.json();let h='';s.forEach(x=>{h+=`<div class=story><span>${x.title} - ${x.views||0} views</span><button onclick="del('${x.id}')">Delete</button></div>`});document.getElementById('list').innerHTML=h||'No stories yet';}
async function post(){let t=title.value,c=content.value,img=image.value,k=key.value; if(!t||!c){msg.innerText='Need title & content';return} let res=await fetch('/api/stories',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':k},body:JSON.stringify({title:t,content:c,image:img})}); let d=await res.json(); if(res.ok){msg.innerText='✅ Posted!'; title.value='';content.value='';image.value=''; load();} else{msg.innerText='❌ Error: '+(d.error||'failed')}}
async function del(id){if(!confirm('Delete?'))return; await fetch('/api/stories/'+id,{method:'DELETE',headers:{'x-admin-key':key.value}}); load();}
load();
</script></body></html>
