<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:Georgia;max-width:650px;margin:40px auto;padding:20px;background:#f8f6f1;line-height:1.8} #box{background:white;padding:30px;border-radius:12px} button{padding:8px 14px;border-radius:20px;border:1px solid #ddd;background:white;cursor:pointer} #comments{margin-top:30px;background:white;padding:20px;border-radius:12px} input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;margin:5px 0;box-sizing:border-box}</style>
</head><body>
<a href="/">← Back to Home</a>
<div id="box"><h1 id="t">Loading...</h1><p id="c"></p>
<div style="display:flex;gap:10px;margin:15px 0;">
<button id="likeBtn" onclick="likeIt()">💗 Like (<span id="lc">0</span>)</button>
<span>👁️ <b id="vc">0</b> views</span>
<button onclick="navigator.clipboard.writeText(location.href); alert('Link copied!')">🔗 Share</button>
</div></div>
<div id="comments"><h3>Comments</h3><div id="list"></div>
<input id="n" placeholder="Your name"><textarea id="m" placeholder="Write comment"></textarea>
<button onclick="postC()" style="background:black;color:white;">Post Comment</button></div>
<script>
const id = new URLSearchParams(location.search).get('id')||'1';
let vid = localStorage.getItem('vid'); if(!vid){vid='v_'+Date.now(); localStorage.setItem('vid',vid);}
async function init(){
  const stories = {1:{title:"The Letter That Never Came", content:"Full story text here... your full story... And then one day, the letter came — but not from where she expected..."},2:{title:"Midnight at Police Bazaar", content:"Full content..."},3:{title:"The Last Song of Cherrapunji", content:"Full..."},4:{title:"Pine Trees Don't Lie", content:"Full..."},5:{title:"You Again, In Laitumkhrah", content:"Full..."}};
  document.getElementById('t').innerText = stories[id]?.title || "Story "+id;
  document.getElementById('c').innerText = stories[id]?.content || "Story content...";
  // add view
  const v = await (await fetch(`/api/views/${id}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({visitor_id:vid})})).json();
  document.getElementById('vc').innerText = v.views;
  // get likes
  const l = await (await fetch(`/api/likes/${id}`)).json();
  document.getElementById('lc').innerText = l.likes||0;
  loadC();
}
async function loadC(){
  const d = await (await fetch(`/api/comments/${id}`)).json();
  document.getElementById('list').innerHTML = d.length? d.map(x=>`<p><b>${x.name}:</b> ${x.comment} <small style=color:#999>(${new Date(x.created_at).toLocaleString()})</small></p>`).join('') : "No comments yet - be first!";
}
async function postC(){
  const name=document.getElementById('n').value, comment=document.getElementById('m').value;
  if(!name||!comment) return alert("Fill both");
  await fetch('/api/comments',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({story_id:id, name, comment})});
  document.getElementById('m').value=""; loadC();
}
async function likeIt(){
  const r = await (await fetch(`/api/likes/${id}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({visitor_id:vid})})).json();
  document.getElementById('lc').innerText = r.likes; document.getElementById('likeBtn').innerText = "💗 Liked ("+r.likes+")";
}
init();
</script></body></html>
