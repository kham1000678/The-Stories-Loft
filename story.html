<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story - The Stories Loft</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>.story-wrap{max-width:720px;margin:0 auto;padding:40px 5% 80px}.story-meta{color:var(--muted);font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}.story-wrap h1{font-size:clamp(32px,5vw,48px);line-height:1.05;margin-bottom:16px}.story-cover{width:100%;height:380px;object-fit:cover;border-radius:22px;margin:18px 0;background:#ece6df}.story-content{font-family:'Lora',serif;font-size:19px;line-height:1.85;margin-top:24px;white-space:pre-wrap}.story-actions{display:flex;gap:12px;margin:28px 0}.action-btn{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}</style>
</head>
<body>
<div class="progress" id="progress" style="position:fixed;top:0;left:0;height:3px;background:var(--text);width:0;z-index:20"></div>
<nav class="navbar"><a href="index.html" class="logo"><span class="logo-mark">T</span> The Stories Loft</a><a href="index.html">← All Stories</a></nav>
<div id="storyRoot" class="story-wrap"><p style="padding:40px;text-align:center">Loading story...</p></div>
<script>
const defaultStories=[
{id:1,title:"The Letter That Never Came",genre:"Love",excerpt:"She waited for three years for a letter that was never written. Or was it?",content:"She kept the mailbox empty on purpose. Because if it was empty, the hope was still alive.\n\nThree winters passed in Shillong. The rain wrote its own letters on her window.\n\nAnd then one day, the letter came — but not from where she expected.",author:"Khamkor Syiemlieh",date:"2026-09-28",readTime:"4 min",cover:"",likes:24,views:312},
{id:2,title:"Midnight at Police Bazaar",genre:"Mystery",excerpt:"A missing diary, a tea stall that never closes, and a city that remembers.",content:"Police Bazaar never sleeps. But that night, it was watching.\n\nThe diary was last seen at 11:47 PM.",author:"Khamkor Syiemlieh",date:"2026-09-25",readTime:"5 min",cover:"",likes:18,views:210},
{id:3,title:"The Last Song of Cherrapunji",genre:"Life",excerpt:"When the rain stops, what do you hear? He went to find out.",content:"He took a bus to Cherrapunji with no return ticket.\n\nEveryone thought he was running away. He was actually running towards something.",author:"Khamkor Syiemlieh",date:"2026-09-20",readTime:"6 min",cover:"",likes:31,views:445}
];
function getStories(){let s=localStorage.getItem('loft_stories');if(s){try{const p=JSON.parse(s);if(p.length>0)return p}catch(e){}}return [...defaultStories];}
const params=new URLSearchParams(location.search);let id=Number(localStorage.getItem('loft_current'))||Number(params.get('id'))||1;
const stories=getStories();let st=stories.find(x=>x.id===id);if(!st)st=stories[0];
document.title=st.title+' — The Stories Loft';
document.getElementById('storyRoot').innerHTML=`
<div class="story-meta">${st.genre} • ${st.readTime} • ${st.date}</div>
<h1>${st.title}</h1>
<p style="color:var(--muted)">By ${st.author} • ❤️ ${st.likes||0} likes • 👁️ ${st.views||0} views</p>
${st.cover?`<img class="story-cover" src="${st.cover}">`:''}
<div class="story-actions"><button class="action-btn" onclick="like()">❤️ Like (${st.likes||0})</button><button class="action-btn" onclick="navigator.clipboard.writeText(location.href);alert('Link copied!')">↗️ Share</button></div>
<div class="story-content">${st.content}</div>
<div style="margin-top:40px;border-top:1px solid var(--line);padding-top:20px"><h3>More stories</h3>${stories.filter(x=>x.id!==st.id).slice(0,2).map(r=>`<div style="padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer" onclick="localStorage.setItem('loft_current',${r.id});location.href='story.html?id=${r.id}'">${r.title} • ${r.genre}</div>`).join('')}</div>
`;
function like(){alert('Liked! ❤️ (Saved on this device)');}
window.addEventListener('scroll',()=>{const h=document.documentElement;const scrolled=(h.scrollTop/(h.scrollHeight-h.clientHeight))*100;document.getElementById('progress').style.width=scrolled+'%';});
</script>
</body>
</html>
